<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - Chaduvu Guru</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50">
    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white py-6 shadow-lg">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold">📊 My Learning Dashboard</h1>
                <p id="welcome-msg" class="text-blue-100 mt-1">Welcome back!</p>
            </div>
            <a href="/user"
                class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg transition backdrop-blur-sm flex items-center gap-2">
                <span>← Back to Study</span>
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <!-- Total Queries Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:shadow-md transition">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Total Queries</p>
                        <p id="total-queries" class="text-3xl font-bold text-blue-600 mt-1">0</p>
                    </div>
                    <div class="bg-blue-50 p-3 rounded-full text-2xl">💬</div>
                </div>
            </div>

            <!-- Streak Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:shadow-md transition">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Current Streak</p>
                        <p id="streak" class="text-3xl font-bold text-orange-500 mt-1">0</p>
                    </div>
                    <div class="bg-orange-50 p-3 rounded-full text-2xl">🔥</div>
                </div>
            </div>

            <!-- Subjects Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:shadow-md transition">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Active Subjects</p>
                        <p id="total-subjects" class="text-3xl font-bold text-green-600 mt-1">0</p>
                    </div>
                    <div class="bg-green-50 p-3 rounded-full text-2xl">📚</div>
                </div>
            </div>

            <!-- Last Active Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:shadow-md transition">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Last Active</p>
                        <p id="last-active" class="text-lg font-bold text-gray-700 mt-2">--</p>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-full text-2xl">📅</div>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <!-- Weekly Activity Chart -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <h2 class="text-xl font-bold mb-4 text-gray-800">Weekly Activity</h2>
                <div class="h-64">
                    <canvas id="weekly-chart"></canvas>
                </div>
            </div>

            <!-- Subject Distribution Chart -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <h2 class="text-xl font-bold mb-4 text-gray-800">Subject Focus</h2>
                <div class="h-64 flex justify-center">
                    <canvas id="subject-chart"></canvas>
                </div>
            </div>
        </div>

        <!-- Recent Questions -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Recent Questions</h2>
            <div id="recent-questions" class="space-y-3">
                <p class="text-gray-400 italic">Loading questions...</p>
            </div>
        </div>

        <!-- My Bag (Notes) -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <span>📝</span> My Bag (Notes)
                </h2>
                <button onclick="showAddNoteModal()"
                    class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition shadow-sm flex items-center gap-2">
                    <span>+</span> Add Note
                </button>
            </div>
            <div id="notes-list" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <p class="text-gray-400 italic col-span-3">Loading notes...</p>
            </div>
        </div>
    </div>

    <!-- Add Note Modal -->
    <div id="add-note-modal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl transform transition-all scale-100">
            <h3 class="text-xl font-bold mb-4 text-gray-800">Add New Note</h3>
            <input id="note-title" type="text" placeholder="Note title..."
                class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            <textarea id="note-content" placeholder="Note content..."
                class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4 h-32 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none"></textarea>
            <div class="flex gap-3">
                <button onclick="saveNote()"
                    class="bg-blue-600 text-white px-4 py-2 rounded-lg flex-1 hover:bg-blue-700 transition font-medium">Save
                    Note</button>
                <button onclick="hideAddNoteModal()"
                    class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition font-medium">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Config Script -->
    <script src="/static/firebase-config.js"></script>

    <script>
        let currentUser = null;
        let userToken = null;

        // Auth listener
        firebase.auth().onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                userToken = await user.getIdToken();
                document.getElementById('welcome-msg').textContent = `Welcome back, ${user.displayName || 'Student'}!`;
                loadDashboard();
            } else {
                // Redirect to login if not authenticated
                window.location.href = '/';
            }
        });

        // Load dashboard data
        async function loadDashboard() {
            try {
                // Load summary
                const summary = await fetchAPI(`/api/dashboard/summary?uid=${currentUser.uid}`);
                document.getElementById('total-queries').textContent = summary.total_queries || 0;
                document.getElementById('streak').textContent = summary.streak || 0;
                document.getElementById('total-subjects').textContent = summary.total_subjects || 0;
                document.getElementById('last-active').textContent = summary.last_active || 'New User';

                // Load weekly activity
                const weekly = await fetchAPI(`/api/dashboard/weekly?uid=${currentUser.uid}&weeks=4`);
                renderWeeklyChart(weekly);

                // Load strength/weakness
                const analysis = await fetchAPI(`/api/dashboard/strength-weakness?uid=${currentUser.uid}`);
                renderSubjectChart(analysis);

                // Load recent questions
                const questions = await fetchAPI(`/api/dashboard/frequent-questions?uid=${currentUser.uid}&limit=5`);
                renderRecentQuestions(questions.questions);

                // Load notes
                const notes = await fetchAPI(`/api/notes/list?uid=${currentUser.uid}`);
                renderNotes(notes.notes);

            } catch (error) {
                console.error('Dashboard load error:', error);
                // Don't show alert, just log error as it might be first time user
            }
        }

        // API helper
        async function fetchAPI(endpoint) {
            const response = await fetch(endpoint, {
                headers: { 'Authorization': `Bearer ${userToken}` }
            });
            if (!response.ok) throw new Error('API request failed');
            return response.json();
        }

        // Render weekly chart
        function renderWeeklyChart(data) {
            const ctx = document.getElementById('weekly-chart').getContext('2d');

            // Destroy existing chart if any
            if (window.weeklyChartInstance) window.weeklyChartInstance.destroy();

            window.weeklyChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.dates.map(d => d.slice(5)), // Show MM-DD
                    datasets: [{
                        label: 'Queries',
                        data: data.counts,
                        borderColor: 'rgb(79, 70, 229)', // Indigo-600
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: 'rgb(79, 70, 229)',
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { borderDash: [2, 4] } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        // Render subject chart
        function renderSubjectChart(analysis) {
            const ctx = document.getElementById('subject-chart').getContext('2d');

            if (window.subjectChartInstance) window.subjectChartInstance.destroy();

            const labels = analysis.strengths.map(s => s.subject.charAt(0).toUpperCase() + s.subject.slice(1));
            const data = analysis.strengths.map(s => s.query_count);

            // Handle empty data
            if (data.length === 0) {
                labels.push('No Data');
                data.push(1);
            }

            window.subjectChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#4f46e5', '#0ea5e9', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' }
                    }
                }
            });
        }

        // Render recent questions
        function renderRecentQuestions(questions) {
            const container = document.getElementById('recent-questions');
            if (!questions || questions.length === 0) {
                container.innerHTML = '<p class="text-gray-400 italic">No questions asked yet.</p>';
                return;
            }

            container.innerHTML = questions.map(q => `
                <div class="border-l-4 border-blue-500 pl-4 py-3 bg-white hover:bg-gray-50 transition rounded-r-lg">
                    <p class="font-medium text-gray-800">${q.query}</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-medium capitalize">${q.subject}</span>
                        <span class="text-xs text-gray-400">• ${q.timestamp || 'Just now'}</span>
                    </div>
                </div>
            `).join('');
        }

        // Render notes
        function renderNotes(notes) {
            const container = document.getElementById('notes-list');
            if (!notes || notes.length === 0) {
                container.innerHTML = `
                    <div class="col-span-3 text-center py-8 border-2 border-dashed border-gray-200 rounded-xl">
                        <p class="text-gray-400 mb-2">Your bag is empty</p>
                        <button onclick="showAddNoteModal()" class="text-blue-600 font-medium hover:underline">Create your first note</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = notes.map((note, idx) => `
                <div class="bg-yellow-50 border border-yellow-100 rounded-lg p-4 hover:shadow-md transition relative group">
                    <h3 class="font-bold mb-2 text-gray-800 pr-6">${note.title}</h3>
                    <p class="text-sm text-gray-700 mb-3 whitespace-pre-wrap">${note.content}</p>
                    <button onclick="deleteNote(${idx})" class="absolute top-3 right-3 text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </button>
                    <div class="text-xs text-gray-400 mt-2 text-right">Note #${idx + 1}</div>
                </div>
            `).join('');
        }

        // Note modal functions
        function showAddNoteModal() {
            document.getElementById('add-note-modal').classList.remove('hidden');
            document.getElementById('note-title').focus();
        }

        function hideAddNoteModal() {
            document.getElementById('add-note-modal').classList.add('hidden');
            document.getElementById('note-title').value = '';
            document.getElementById('note-content').value = '';
        }

        async function saveNote() {
            const title = document.getElementById('note-title').value;
            const content = document.getElementById('note-content').value;

            if (!title || !content) {
                alert('Please fill in both fields');
                return;
            }

            try {
                const response = await fetch('/api/notes/add', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${userToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        uid: currentUser.uid,
                        title: title,
                        content: content
                    })
                });

                if (response.ok) {
                    hideAddNoteModal();
                    loadDashboard(); // Reload to show new note
                } else {
                    alert('Failed to save note');
                }
            } catch (error) {
                console.error('Save note error:', error);
                alert('Error saving note');
            }
        }

        async function deleteNote(index) {
            if (!confirm('Delete this note?')) return;

            try {
                const response = await fetch('/api/notes/delete', {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${userToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        uid: currentUser.uid,
                        note_index: index
                    })
                });

                if (response.ok) {
                    loadDashboard(); // Reload notes
                }
            } catch (error) {
                console.error('Delete note error:', error);
            }
        }
    </script>
</body>

</html>
